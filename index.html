<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Entreno · Hipertrofia + Boxeo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Entreno">
<meta name="format-detection" content="telephone=no">
<style>
  :root{
    --bg:#0b1220; --card:#151f31; --card2:#1c2942; --line:#26344d;
    --tx:#e8eef7; --tx2:#9fb0c8; --tx3:#6f82a0;
    --or:#fb923c; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --blu:#60a5fa; --vio:#a78bfa;
    --sb: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--tx); overflow-x:hidden;
    font:16px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
    padding-bottom:calc(150px + var(--sb));
    overscroll-behavior-y:contain; -webkit-overflow-scrolling:touch;
  }
  h1,h2,h3{margin:0}
  button{font-family:inherit}

  /* ---------- cabecera ---------- */
  header{
    position:sticky; top:0; z-index:20; background:rgba(11,18,32,.97);
    backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:10px 12px 8px; padding-top:calc(10px + env(safe-area-inset-top,0px));
  }
  .top{display:flex; align-items:center; gap:8px; min-width:0}
  .brand{font-weight:800; font-size:16px; letter-spacing:.5px; flex:0 0 auto}
  .pill{
    font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:999px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0
  }
  .pill.ph{margin-left:auto; color:var(--or); background:#2a1c10; border:1px solid #5b3618}
  .pill.rd{color:var(--ok); background:#0f2a20; border:1px solid #1f5c43; cursor:pointer}
  .pill.rd.mid{color:var(--warn); background:#2a2210; border-color:#5c4a18}
  .pill.rd.low{color:var(--bad); background:#2a1414; border-color:#5c2020}
  .modes{display:flex; gap:6px; margin-top:9px}
  .modes button{
    flex:1 1 0; min-width:0; padding:8px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--card); color:var(--tx2); font-weight:700; font-size:13.5px; cursor:pointer
  }
  .modes button[aria-pressed=true]{background:var(--or); border-color:var(--or); color:#1a1006}
  .days{display:flex; gap:5px; margin-top:8px}
  .days button{
    flex:1 1 0; min-width:0; padding:8px 2px; border-radius:10px; position:relative;
    border:1px solid var(--line); background:var(--card); color:var(--tx2);
    font-weight:700; font-size:14px; cursor:pointer
  }
  .days button .dot{
    position:absolute; top:4px; right:5px; width:6px; height:6px; border-radius:50%;
    background:var(--ok); display:none
  }
  .days button.hoy .dot{display:block}

  /* ---------- contenedor ---------- */
  main{padding:12px 12px 4px; max-width:620px; margin:0 auto}
  .view{display:none}
  .view.on{display:block}

  .dayhead{border-radius:14px; padding:12px 14px; margin-bottom:10px}
  .dayhead h1{font-size:20px; letter-spacing:1px}
  .dayhead p{margin:2px 0 0; font-size:14px; opacity:.93}
  .banner{
    background:#2a1c10; border:1px solid #5b3618; color:#ffd7b0;
    border-radius:12px; padding:10px 12px; font-size:13px; margin-bottom:11px
  }
  .banner.g{background:#0f2a20; border-color:#1f5c43; color:#b8f0d8}
  .banner.r{background:#2a1414; border-color:#5c2020; color:#fbc4c4}
  .banner.b{background:#101f33; border-color:#24456b; color:#bcd6f5}
  .sect{font-size:12px; font-weight:800; color:var(--tx3); letter-spacing:1.2px; margin:16px 0 8px}

  /* ---------- barra de sesión ---------- */
  .sessbar{
    display:flex; gap:7px; align-items:center; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:9px 11px; margin-bottom:11px; font-size:13px
  }
  .sessbar .k{font-weight:800; font-size:17px; font-variant-numeric:tabular-nums}
  .sessbar .k.over{color:var(--bad)}
  .sessbar .sep{flex:1}
  .sessbar button{
    padding:7px 11px; border-radius:9px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:700; font-size:12.5px; cursor:pointer
  }
  .sessbar button.on{background:var(--ok); border-color:var(--ok); color:#06281c}

  /* ---------- ejercicios ---------- */
  .ex{background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:11px; overflow:hidden}
  .ex.pr{border-color:#7a5a12; box-shadow:inset 0 0 0 1px #46340a}
  .exhead{display:flex; gap:11px; padding:11px 12px 8px; align-items:flex-start}
  .thumb{width:60px; height:60px; flex:0 0 60px; background:var(--card2); border-radius:10px; padding:2px}
  .icon{width:100%; height:100%; display:block}
  .fig{stroke:#dbe5f2; stroke-width:4.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .head{fill:#dbe5f2}
  .eq{stroke:var(--or); stroke-width:4.4; fill:none; stroke-linecap:round; stroke-linejoin:round}
  .eqc{stroke:var(--or); stroke-width:4.4; fill:none}
  .pl{stroke:var(--or); stroke-width:9; fill:none; stroke-linecap:round}
  .frame{stroke:#607796; stroke-width:4.2; fill:none; stroke-linecap:round}
  .dash{stroke:var(--or); stroke-width:3; fill:none; stroke-dasharray:6 5; stroke-linecap:round}
  .exmeta{min-width:0; flex:1}
  .exname{font-weight:700; font-size:15.5px; line-height:1.25}
  .extarget{font-size:15px; font-weight:800; margin-top:3px}
  .tag{
    font-size:10px; font-weight:800; color:var(--or); border:1px solid var(--or);
    background:#2a1c10; padding:2px 6px; border-radius:999px; margin-left:5px;
    vertical-align:1px; letter-spacing:.3px; white-space:nowrap
  }
  .tag.sug{color:var(--ok); border-color:#1f5c43; background:#0f2a20}
  .tag.prb{color:#facc15; border-color:#7a5a12; background:#2a2210}
  .exlast{font-size:12.5px; color:var(--tx3); margin-top:4px}
  .exlast b{color:var(--tx2); font-weight:700}
  .colheads{font-size:10.5px; color:var(--tx3); display:flex; gap:7px; padding:5px 12px 0}
  .colheads span:first-child{width:22px; flex:0 0 22px}
  .colheads span.c{flex:1 1 0; text-align:center}
  .colheads span.r{flex:0 0 40px}
  .sets{padding:0 12px 10px}
  .setrow{display:flex; align-items:center; gap:6px; margin-top:6px}
  .sn{width:22px; flex:0 0 22px; text-align:center; font-size:12px; font-weight:800; color:var(--tx3)}
  .setrow input{
    flex:1 1 0; min-width:0; height:42px; background:var(--card2); color:var(--tx);
    border:1px solid var(--line); border-radius:10px; padding:0 6px;
    font-size:16px; font-weight:700; text-align:center
  }
  .setrow input:focus{outline:2px solid var(--or); outline-offset:-2px}
  .setrow input.filled{border-color:#2f6b52; background:#132a22}
  .rest{
    flex:0 0 40px; width:40px; height:42px; border-radius:10px; cursor:pointer;
    background:var(--card2); border:1px solid var(--line); color:var(--or); font-size:16px
  }
  .exnote{border-top:1px solid var(--line); padding:8px 12px; font-size:12.5px; color:var(--tx3); background:#111a2a}

  /* ---------- genéricos ---------- */
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 13px; margin-bottom:11px}
  .card h3{font-size:15px; margin-bottom:8px}
  .kpis{display:grid; grid-template-columns:repeat(2,1fr); gap:9px; margin-bottom:11px}
  .kpis.three{grid-template-columns:repeat(3,1fr)}
  .kpi{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 11px}
  .kpi .v{font-size:23px; font-weight:800; line-height:1.15; font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11.5px; color:var(--tx3); margin-top:2px}
  .kpi .s{font-size:11px; color:var(--tx2); margin-top:3px}
  .row{display:flex; gap:8px; flex-wrap:wrap}
  .row>*{flex:1 1 0; min-width:0}
  .btn{
    padding:11px 10px; border-radius:11px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:700; font-size:13.5px; cursor:pointer
  }
  .btn.pri{background:var(--or); border-color:var(--or); color:#1a1006}
  .btn.ok{background:var(--ok); border-color:var(--ok); color:#06281c}
  .btn.dgr{color:#fca5a5; border-color:#7f2222}
  .btn.sm{padding:7px 9px; font-size:12px}
  label.f{display:block; font-size:12px; color:var(--tx2); margin:11px 0 5px; font-weight:600}
  /* 16px como mínimo en campos: por debajo, iOS hace zoom al enfocar */
  input.f, select.f, textarea.f{
    width:100%; background:var(--card2); color:var(--tx); border:1px solid var(--line);
    border-radius:10px; padding:10px; font-size:16px; font-family:inherit
  }
  textarea.f{height:96px; font-size:16px; font-family:ui-monospace,Consolas,monospace}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
  .mini{font-size:11.5px; color:var(--tx3); margin-top:7px; line-height:1.4}
  details.block{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:11px 13px; margin:4px 0 12px}
  details.block summary{font-weight:700; cursor:pointer; font-size:14.5px}
  details.block ul{margin:9px 0 0; padding-left:18px; color:var(--tx2); font-size:13.5px}
  details.block li{margin-bottom:6px}

  /* ---------- listas / barras ---------- */
  .bar{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-size:12.5px}
  .bar .nm{flex:0 0 84px; color:var(--tx2); font-weight:600}
  .bar .tr{flex:1 1 0; height:16px; background:var(--card2); border-radius:8px; position:relative; overflow:hidden}
  .bar .fi{position:absolute; left:0; top:0; bottom:0; border-radius:8px; background:var(--blu)}
  .bar .fi.lo{background:#3f5f86}
  .bar .fi.hi{background:var(--warn)}
  .bar .zone{position:absolute; top:0; bottom:0; background:rgba(52,211,153,.16); border-left:1px solid #1f5c43; border-right:1px solid #1f5c43}
  .bar .vl{flex:0 0 52px; text-align:right; font-weight:800; font-variant-numeric:tabular-nums}
  .lst{font-size:13.5px}
  .lst .it{display:flex; gap:9px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line)}
  .lst .it:last-child{border-bottom:0}
  .lst .it .g{flex:1 1 0; min-width:0}
  .lst .it .t{font-weight:700; font-size:13.5px}
  .lst .it .d{font-size:11.5px; color:var(--tx3)}
  .lst .it .n{font-weight:800; font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
  .up{color:var(--ok)} .dn{color:var(--bad)} .fl{color:var(--tx3)}

  /* ---------- calendario ---------- */
  .calnav{display:flex; align-items:center; gap:8px; margin-bottom:9px}
  .calnav .m{flex:1 1 0; text-align:center; font-weight:800; font-size:15px}
  .calnav button{flex:0 0 40px; padding:8px 0; border-radius:10px; border:1px solid var(--line); background:var(--card2); color:var(--tx); cursor:pointer; font-weight:800}
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
  .cal .dw{text-align:center; font-size:10.5px; color:var(--tx3); font-weight:700; padding-bottom:2px}
  .cal .cd{
    aspect-ratio:1/1.12; border:1px solid var(--line); background:var(--card); border-radius:9px;
    padding:3px 0 0; position:relative; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:flex-start; gap:2px
  }
  .cal .cd.void{background:transparent; border-color:transparent; cursor:default}
  .cal .cd.today{border-color:var(--or)}
  .cal .cd .n{font-size:11.5px; font-weight:700; color:var(--tx2)}
  .cal .cd .mk{display:flex; gap:2px}
  .cal .cd .mk i{width:5px; height:5px; border-radius:50%; display:block}
  .mk i.g{background:var(--blu)} .mk i.b{background:var(--bad)} .mk i.a{background:var(--vio)}
  .leg{display:flex; gap:12px; font-size:11.5px; color:var(--tx3); margin-top:9px; flex-wrap:wrap}
  .leg span{display:flex; align-items:center; gap:5px}
  .leg i{width:7px; height:7px; border-radius:50%; display:block}

  /* ---------- gráficas ---------- */
  .chart{width:100%; height:150px; display:block}
  .chart .ax{stroke:#2b3b56; stroke-width:1}
  .chart .gl{stroke:#1e2b42; stroke-width:1}
  .chart .ln{fill:none; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round}
  .chart .ar{fill-opacity:.14}
  .chart .pt{stroke:#0b1220; stroke-width:1.5}
  .chart text{fill:#6f82a0; font-size:10px}
  .chips{display:flex; gap:6px; overflow-x:auto; padding-bottom:7px; margin-bottom:4px}
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; padding:7px 11px; border-radius:999px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx2); font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap
  }
  .chip[aria-pressed=true]{background:var(--or); border-color:var(--or); color:#1a1006}

  /* ---------- barra inferior ---------- */
  .timerbar{
    position:fixed; left:0; right:0; bottom:calc(58px + var(--sb)); z-index:29;
    background:rgba(17,26,42,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line);
    padding:8px 12px; display:flex; align-items:center; gap:7px; max-width:620px; margin:0 auto
  }
  .tdisp{font-variant-numeric:tabular-nums; font-weight:800; font-size:22px; flex:0 0 60px}
  .tdisp.run{color:var(--ok)} .tdisp.done{color:var(--or)}
  .timerbar button{
    flex:1 1 0; min-width:0; padding:10px 0; border-radius:10px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:800; font-size:13px; cursor:pointer
  }
  .timerbar button.stop{flex:0 0 40px; color:var(--tx3)}
  nav.tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
    background:rgba(11,18,32,.99); border-top:1px solid var(--line);
    padding-bottom:var(--sb); max-width:620px; margin:0 auto
  }
  nav.tabs button{
    flex:1 1 0; min-width:0; background:none; border:0; color:var(--tx3); cursor:pointer;
    padding:8px 0 9px; font-size:10.5px; font-weight:700; display:flex; flex-direction:column;
    align-items:center; gap:3px
  }
  nav.tabs button b{font-size:17px; line-height:1; font-weight:400}
  nav.tabs button[aria-pressed=true]{color:var(--or)}

  /* ---------- modo sesión guiada ---------- */
  #gs{
    position:fixed; inset:0; z-index:60; background:var(--bg); display:none;
    flex-direction:column; padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + var(--sb));
    max-width:620px; margin:0 auto
  }
  #gs.on{display:flex}
  .gsTop{display:flex; align-items:center; gap:10px; margin-bottom:8px}
  .gsTop .x{
    flex:0 0 38px; height:38px; border-radius:11px; background:var(--card); color:var(--tx2);
    border:1px solid var(--line); font-size:18px; cursor:pointer
  }
  .gsTop .ti{flex:1 1 0; min-width:0}
  .gsTop .ti b{display:block; font-size:15px; line-height:1.2}
  .gsTop .ti span{font-size:11.5px; color:var(--tx3)}
  .gsProg{height:5px; border-radius:3px; background:var(--card2); overflow:hidden; margin-bottom:12px}
  .gsProg i{display:block; height:100%; background:var(--ok); border-radius:3px; transition:width .25s}
  .gsBody{flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .gsIco{width:112px; height:112px; margin:2px auto 8px; background:var(--card); border-radius:16px; padding:6px}
  .gsName{text-align:center; font-size:19px; font-weight:800; line-height:1.25}
  .gsSet{text-align:center; font-size:12.5px; color:var(--tx3); margin-top:3px; letter-spacing:.6px}
  .gsTgt{
    display:flex; gap:9px; margin:14px 0 6px; align-items:stretch
  }
  .gsFld{flex:1 1 0; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:9px 8px}
  .gsFld .lb{font-size:10.5px; color:var(--tx3); text-align:center; font-weight:700; letter-spacing:.7px}
  .gsFld .rw{display:flex; align-items:center; gap:5px; margin-top:5px}
  .gsFld button{
    flex:0 0 36px; height:44px; border-radius:11px; background:var(--card2); border:1px solid var(--line);
    color:var(--or); font-size:21px; font-weight:700; cursor:pointer
  }
  .gsFld input{
    flex:1 1 0; min-width:0; height:44px; background:transparent; border:0; color:var(--tx);
    font-size:26px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums
  }
  .gsFld input:focus{outline:2px solid var(--or); outline-offset:-1px; border-radius:8px}
  .gsHint{text-align:center; font-size:12px; color:var(--tx3); min-height:17px}
  .gsHint b{color:var(--ok)}
  .gsPl{
    margin-top:9px; background:#111a2a; border:1px solid var(--line); border-radius:12px;
    padding:9px 11px; font-size:13px; color:var(--tx2); text-align:center
  }
  .gsRest{text-align:center; margin-top:12px}
  .gsRest .k{font-size:44px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--ok); line-height:1}
  .gsRest .k.done{color:var(--or)}
  .gsRest .l{font-size:11.5px; color:var(--tx3); letter-spacing:.8px; margin-top:2px}
  .gsRir{margin-top:13px; background:var(--card); border:1px solid #5b3618; border-radius:14px; padding:11px 12px}
  .gsRir p{margin:0 0 9px; font-size:13px; color:#ffd7b0}
  .gsRirB{display:flex; gap:6px}
  .gsRirB button{
    flex:1 1 0; min-width:0; padding:12px 0; border-radius:11px; background:var(--card2);
    border:1px solid var(--line); color:var(--tx); font-weight:800; font-size:16px; cursor:pointer
  }
  .gsRirB button small{display:block; font-size:9px; font-weight:600; color:var(--tx3); margin-top:2px}
  .gsFoot{padding-top:10px; display:flex; gap:8px}
  .gsFoot button{
    flex:1 1 0; min-width:0; padding:16px 0; border-radius:14px; border:1px solid var(--line);
    background:var(--card2); color:var(--tx); font-weight:800; font-size:16px; cursor:pointer
  }
  .gsFoot button.go{background:var(--ok); border-color:var(--ok); color:#06281c; flex:2 1 0}
  .gsFoot button.nav{flex:0 0 52px; font-size:19px; color:var(--tx2)}
  .gsEnd{text-align:center; padding:26px 6px}
  .gsEnd .b{font-size:46px}
  .gsEnd h2{font-size:21px; margin:8px 0 6px}
  .gsEnd p{font-size:13.5px; color:var(--tx2); margin:0 0 4px}

  dialog{
    border:1px solid var(--line); background:var(--card); color:var(--tx);
    border-radius:16px; padding:0; width:min(560px,94vw); max-height:88vh
  }
  dialog::backdrop{background:rgba(0,0,0,.66)}
  .dlg{padding:15px}
  .dlg h2{font-size:17px; margin-bottom:4px}
  .foot{text-align:center; color:var(--tx3); font-size:11.5px; padding:4px 0 12px}
  .hide{display:none !important}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="brand">ENTRENO</div>
    <div class="pill ph" id="phase">–</div>
    <div class="pill rd" id="rdPill" role="button" tabindex="0">Check-in</div>
  </div>
  <div id="hdSel">
    <nav class="modes" role="group" aria-label="Tipo de sesión">
      <button type="button" data-mode="gym" aria-pressed="true">Gimnasio</button>
      <button type="button" data-mode="abs" aria-pressed="false">Abdomen</button>
    </nav>
    <nav class="days" id="days" role="group" aria-label="Día de la semana"></nav>
  </div>
</header>

<main>
  <section class="view on" id="v-hoy"></section>
  <section class="view" id="v-cal"></section>
  <section class="view" id="v-pro"></section>
  <section class="view" id="v-cue"></section>
  <section class="view" id="v-per"></section>
</main>
<div class="foot" id="foot"></div>

<section id="gs" aria-label="Sesión guiada"></section>

<div class="timerbar" id="timerbar">
  <div class="tdisp" id="tdisp" aria-live="polite">0:00</div>
  <button type="button" data-t="45">45 s</button>
  <button type="button" data-t="90">90 s</button>
  <button type="button" data-t="150">2:30</button>
  <button type="button" class="stop" id="tstop" aria-label="Parar cronómetro">■</button>
</div>

<nav class="tabs" role="tablist">
  <button type="button" data-v="hoy" aria-pressed="true"><b>▦</b>Hoy</button>
  <button type="button" data-v="cal" aria-pressed="false"><b>▤</b>Calendario</button>
  <button type="button" data-v="pro" aria-pressed="false"><b>◪</b>Progreso</button>
  <button type="button" data-v="cue" aria-pressed="false"><b>◍</b>Cuerpo</button>
  <button type="button" data-v="per" aria-pressed="false"><b>☰</b>Perfil</button>
</nav>

<!-- check-in de recuperación -->
<dialog id="dRd"><div class="dlg">
  <h2>Check-in de recuperación</h2>
  <p class="mini">20 segundos. Con 10 sesiones semanales, tu limitante es la recuperación, no el estímulo.</p>
  <label class="f" for="rSleep">Horas de sueño esta noche</label>
  <input class="f" type="number" id="rSleep" step="0.5" min="0" max="14" inputmode="decimal" placeholder="7.5">
  <label class="f" for="rSore">Agujetas / molestias (1 ninguna – 5 muchas)</label>
  <input class="f" type="range" id="rSore" min="1" max="5" step="1" value="2">
  <label class="f" for="rEner">Energía (1 fundido – 5 pletórico)</label>
  <input class="f" type="range" id="rEner" min="1" max="5" step="1" value="4">
  <label class="f" for="rBox">¿Cómo fue el boxeo?</label>
  <select class="f" id="rBox">
    <option value="2">Mejor de lo normal</option>
    <option value="1" selected>Igual que siempre</option>
    <option value="0">Peor de lo normal</option>
  </select>
  <div class="row" style="margin-top:13px">
    <button type="button" class="btn pri" id="rSave">Guardar</button>
    <button type="button" class="btn" id="rClose">Cerrar</button>
  </div>
</div></dialog>

<!-- día del calendario -->
<dialog id="dDay"><div class="dlg">
  <h2 id="ddTitle">Día</h2>
  <p class="mini" id="ddSub"></p>
  <label class="f">Boxeo</label>
  <div class="grid2">
    <select class="f" id="ddBoxInt">
      <option value="0">Sin boxeo</option>
      <option value="6">Técnica / sombra (suave)</option>
      <option value="7.8" selected>Sacos y manoplas</option>
      <option value="9">Guanteo ligero</option>
      <option value="12">Sparring</option>
    </select>
    <input class="f" type="number" id="ddBoxMin" inputmode="numeric" placeholder="min" min="0" max="240">
  </div>
  <label class="f">Sesiones</label>
  <div class="grid2">
    <label class="btn sm" style="text-align:left"><input type="checkbox" id="ddGym"> Gimnasio</label>
    <label class="btn sm" style="text-align:left"><input type="checkbox" id="ddAbs"> Abdomen</label>
  </div>
  <label class="f" for="ddNote">Nota del día</label>
  <input class="f" type="text" id="ddNote" placeholder="Molestia en hombro, dormí mal...">
  <div class="banner b" id="ddKcal" style="margin-top:12px">–</div>
  <div class="row">
    <button type="button" class="btn pri" id="ddSave">Guardar</button>
    <button type="button" class="btn" id="ddClose">Cerrar</button>
  </div>
</div></dialog>

<!-- editor de bloques -->
<dialog id="dEd"><div class="dlg" id="edBody"></div></dialog>

<!-- informe -->
<dialog id="dRep"><div class="dlg">
  <h2>Informe de evolución</h2>
  <p class="mini">Descarga el archivo y adjúntalo en el chat, o copia el resumen y pégalo directamente.</p>
  <textarea class="f" id="repTxt" style="height:200px" readonly></textarea>
  <div class="row" style="margin-top:12px">
    <button type="button" class="btn pri" id="repCopy">Copiar resumen</button>
    <button type="button" class="btn ok" id="repDl">Descargar archivo</button>
  </div>
  <div class="row">
    <button type="button" class="btn" id="repClose">Cerrar</button>
  </div>
</div></dialog>

const pp=(x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1;return[-dy/L,dx/L];};
const ln=(c,x1,y1,x2,y2)=>`<line class="${c}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;
const pl=(c,p)=>`<polyline class="${c}" points="${p}"/>`;
const pa=(c,d)=>`<path class="${c}" d="${d}"/>`;
const hd=(x,y,r=7)=>`<circle class="head" cx="${x}" cy="${y}" r="${r}"/>`;
const fl=(y=90)=>ln('frame',6,y,94,y);
function db(x1,y1,x2,y2,p=13){const[px,py]=pp(x1,y1,x2,y2),h=p/2;let s=ln('eq',x1,y1,x2,y2);
  for(const[ex,ey]of[[x1,y1],[x2,y2]])s+=ln('pl',(ex-px*h).toFixed(1),(ey-py*h).toFixed(1),(ex+px*h).toFixed(1),(ey+py*h).toFixed(1));return s;}
function bb(x1,y1,x2,y2,p=16,i=.12){const[px,py]=pp(x1,y1,x2,y2),h=p/2;let s=ln('eq',x1,y1,x2,y2);
  for(const t of[i,1-i]){const ex=x1+(x2-x1)*t,ey=y1+(y2-y1)*t;
    s+=ln('pl',(ex-px*h).toFixed(1),(ey-py*h).toFixed(1),(ex+px*h).toFixed(1),(ey+py*h).toFixed(1));}return s;}
function ar(x1,y1,x2,y2,s=5){const a=Math.atan2(y2-y1,x2-x1),a1=a+2.618,a2=a-2.618;
  return ln('eq',x1,y1,x2,y2)+pl('eq',`${(x2+s*Math.cos(a1)).toFixed(1)},${(y2+s*Math.sin(a1)).toFixed(1)} ${x2},${y2} ${(x2+s*Math.cos(a2)).toFixed(1)},${(y2+s*Math.sin(a2)).toFixed(1)}`);}

/* ======================= capa de datos aislada ==========================
   Todo el acceso a almacenamiento pasa por Store. Hoy escribe en localStorage;
   el día que haya cuentas y servidor, solo cambia Store: ni una sola vista ni
   cálculo necesita tocarse. Por eso save() es diferido y devuelve promesa,
   igual que se comportará una escritura en red.
   ====================================================================== */
const SCHEMA=3;
const Store={
  uid:'local',
  key(){ return 'entreno_u_'+this.uid; },
  /* migraciones encadenadas: cada una sube un número de esquema */
  MIGR:{
    2:d=>{ /* v2 (sin esquema) -> v3: id de usuario y sitio para RIR por serie */
      d.schema=3; d.uid='local';
      Object.keys(d.log||{}).forEach(day=>{
        const ex=(d.log[day]||{}).ex||{};
        Object.keys(ex).forEach(k=>{
          if(!Array.isArray(ex[k])) ex[k]=[];
          ex[k]=ex[k].map(s=>(s&&typeof s==='object')?s:{});
        });
      });
      return d;
    }
  },
  migrate(o){
    let v=+(o.schema||2), n=0;
    while(v<SCHEMA&&this.MIGR[v]&&n++<10){ o=this.MIGR[v](o)||o; v=+(o.schema||v+1); }
    o.schema=SCHEMA;
    return o;
  },
  read(){
    /* 1. clave nueva · 2. clave v2 (se migra) · 3. nada */
    for(const k of [this.key(),'entreno_v2']){
      try{ const r=localStorage.getItem(k);
        if(r){ const o=JSON.parse(r);
          if(k!==this.key()){ try{localStorage.setItem('entreno_pre3_bak',r);}catch(e){} }
          return this.migrate(o);
        }
      }catch(e){}
    }
    return null;
  },
  _to:null,
  /* escritura diferida: agrupa las ráfagas de teclas en una sola escritura */
  save(obj,ms){
    obj.updatedAt=Date.now();
    clearTimeout(this._to);
    return new Promise(res=>{
      this._to=setTimeout(()=>{ res(this.flush(obj)); }, ms==null?350:ms);
    });
  },
  flush(obj){
    clearTimeout(this._to);
    try{ localStorage.setItem(this.key(),JSON.stringify(obj||DB)); return true; }
    catch(e){ toast('No se pudo guardar. ¿Sin espacio o modo incógnito?'); return false; }
  },
  raw(){ this.flush(DB); return JSON.stringify(DB); }
};

}

/* -------------------------- fuerza y progresión ------------------------- */
const e1rm=(kg,reps)=>(kg>0&&reps>0)?kg*(1+reps/30):0;
function bestSet(sets){
  let b=null;
  (sets||[]).forEach(s=>{
    if(!s) return; const kg=nm(s.kg),rp=nm(s.reps); if(!kg||!rp) return;
    const e=e1rm(kg,rp); if(!b||e>b.e) b={kg,reps:rp,e};
  });
  return b;
}
/* historial de un ejercicio: [{date,sets,best,vol}] ascendente */
function hist(k,upto){
  const out=[];
  Object.keys(DB.log).sort().forEach(d=>{
    if(upto&&d>=upto) return;
    const s=DB.log[d].ex&&DB.log[d].ex[k];
    if(!s) return;
    const b=bestSet(s); if(!b) return;
    let vol=0; s.forEach(x=>{if(x){const kg=nm(x.kg)||0,rp=nm(x.reps)||0; vol+=kg*rp;}});
    out.push({date:d,sets:s,best:b,vol});
  });
  return out;
}
const lastOf=k=>{const h=hist(k,TODAY()); return h.length?h[h.length-1]:null;};
function topRep(r){ const m=String(r).match(/(\d+)\s*-\s*(\d+)/); if(m) return +m[2];
  const s=String(r).match(/(\d+)/); return s?+s[1]:null; }
function botRep(r){ const m=String(r).match(/(\d+)\s*-\s*(\d+)/); return m?+m[1]:null; }
/* sugerencia de carga: doble progresión corregida con el RIR de la última sesión */
function sugg(ex,k){
  const l=lastOf(k); if(!l) return null;
  const top=topRep(ex.r); if(!top) return null;
  const lo=botRep(ex.r), r=rirOf(k,l.date);
  const done=l.sets.filter(s=>s&&nm(s.kg)&&nm(s.reps));
  if(done.length<ex.s) return {kg:l.best.kg,why:'repite',rir:r};
  const allTop=done.every(s=>nm(s.reps)>=top);
  if(allTop){
    /* si además le sobraban repeticiones, el salto puede ser mayor */
    const pct=(r!=null&&r>=3)?0.05:0.025;
    return {kg:nextLoad(l.best.kg,pct),why:'sube',rir:r};
  }
  const minR=Math.min.apply(null,done.map(s=>nm(s.reps)));
  if(lo&&minR<lo&&r!=null&&r<=0) return {kg:roundLoad(l.best.kg*0.95),why:'baja',rir:r};
  return {kg:l.best.kg,why:'repite',rir:r};
}
/* estancamiento: sin mejora de e1RM en las 3 últimas sesiones */
function stalled(k){
  const h=hist(k); if(h.length<3) return false;
  const t=h.slice(-3).map(x=>x.best.e);
  return t[1]<=t[0]*1.005 && t[2]<=t[0]*1.005;
}
function prCheck(k,name){
  const h=hist(k); if(!h.length) return;
  const b=h[h.length-1].best, prev=DB.prs[k];
  if(!prev||b.e>prev.e*1.001){
    DB.prs[k]={kg:b.kg,reps:b.reps,e:b.e,date:h[h.length-1].date,name};
    return true;
  }
  return false;
}

function weekStart(d){ const x=dOf(d); const w=(x.getDay()+6)%7; return shift(d,-w); }
/* series efectivas por músculo en la semana que contiene d */
function volWeek(d){
  const ws=weekStart(d), acc={}; MUS.forEach(m=>acc[m]=0);
  let series=0, ton=0, sesiones=0;
  for(let i=0;i<7;i++){
    const day=shift(ws,i), L=DB.log[day]; if(!L||!L.ex) continue;
    let anySet=false;
    Object.keys(L.ex).forEach(k=>{
      const [m,dk,...rest]=k.split('|'), nme=rest.join('|');
      const D=dayObj(m==='abs'?'abs':'gym',dk);
      const ex=(D.e||[]).find(x=>x.n===nme);
      const done=(L.ex[k]||[]).filter(s=>s&&(nm(s.kg)||nm(s.reps))).length;
      if(!done) return;
      anySet=true; series+=done;
      (L.ex[k]||[]).forEach(s=>{if(s){ton+=(nm(s.kg)||0)*(nm(s.reps)||0);}});
      if(ex&&ex.m) Object.keys(ex.m).forEach(mu=>{acc[mu]=(acc[mu]||0)+ex.m[mu]*done;});
    });
    if(anySet) sesiones++;
  }
  return {ws,acc,series,ton,sesiones};
}

/* ------------------------------ calorías ------------------------------- */
function kcalOf(met,min,kg){ if(!met||!min||!kg) return 0; return met*3.5*kg/200*min; }
function lastWeight(upto){
  const ks=Object.keys(DB.body).filter(d=>DB.body[d]&&nm(DB.body[d].w)&&(!upto||d<=upto)).sort();
  return ks.length?nm(DB.body[ks[ks.length-1]].w):null;
}
function dayKcal(d){
  const L=DB.log[d]; if(!L) return 0;
  const w=lastWeight(d)||75; let k=0;
  if(L.box&&L.box.min) k+=kcalOf(+L.box.int||7.8,+L.box.min,w);
  if(L.gym) k+=kcalOf(MET.gym,L.gymMin||60,w);
  if(L.abs) k+=kcalOf(MET.abs,10,w);
  return Math.round(k);
}
function bmr(){
  const p=DB.profile, w=lastWeight(), h=nm(p.height), a=nm(p.age);
  if(!w||!h||!a) return null;
  const s=p.sex==='m'?-161:5;
  return Math.round(10*w+6.25*h-5*a+s);
}
function tdeeWeek(d){
  const b=bmr(); if(!b) return null;
  const ws=weekStart(d||TODAY()); let ex=0, n=0;
  for(let i=0;i<7;i++){ const dd=shift(ws,i); if(dd>TODAY()) break; ex+=dayKcal(dd); n++; }
  if(!n) return null;
  return Math.round(b*1.25+ex/n);
}
/* --------------------------- tendencia de peso -------------------------- */
function wSeries(){
  return Object.keys(DB.body).filter(d=>nm(DB.body[d]&&DB.body[d].w)).sort()
    .map(d=>({d,w:nm(DB.body[d].w)}));
}
function wMA(series,win=7){
  return series.map(p=>{
    const lo=shift(p.d,-(win-1));
    const sel=series.filter(q=>q.d>=lo&&q.d<=p.d);
    return {d:p.d,w:sel.reduce((a,b)=>a+b.w,0)/sel.length};
  });
}
/* %/semana sobre los últimos 28 días usando media móvil */
function wRate(){
  const ma=wMA(wSeries()); if(ma.length<2) return null;
  const last=ma[ma.length-1];
  const cand=ma.filter(p=>dif(last.d,p.d)>=10);
  const first=cand.length?cand[cand.length-1]:ma[0];
  const dd=dif(last.d,first.d); if(dd<7) return null;
  const pct=((last.w-first.w)/first.w)*100/(dd/7);
  return {pct,days:dd,from:first,to:last};
}
function wVerdict(){
  const r=wRate(); if(!r) return null;
  const p=r.pct;
  if(p<.1) return {cl:'warn',t:'Te has quedado corto de calorías',s:`Subes ${r1(p)} %/semana. Añade 250 kcal al día.`};
  if(p<=.55) return {cl:'ok',t:'Ritmo de ganancia correcto',s:`${r1(p)} %/semana está en el rango bueno. No cambies nada.`};
  if(p<=.8) return {cl:'warn',t:'Vas algo rápido',s:`${r1(p)} %/semana. Quita 150-200 kcal si la cintura sube.`};
  return {cl:'bad',t:'Demasiado rápido',s:`${r1(p)} %/semana. Buena parte no es músculo. Quita 300 kcal.`};
}
/* calidad de la ganancia: cintura vs peso */
function gainQuality(){
  const bs=Object.keys(DB.body).filter(d=>nm(DB.body[d].w)&&nm(DB.body[d].cintura)).sort();
  if(bs.length<2) return null;
  const a=DB.body[bs[0]], b=DB.body[bs[bs.length-1]];
  const dw=nm(b.w)-nm(a.w), dc=nm(b.cintura)-nm(a.cintura);
  if(Math.abs(dw)<.5) return null;
  const ratio=dc/dw;
  let cl='ok',t='Ganancia de calidad';
  if(ratio>1.2){cl='bad';t='Estás ganando sobre todo grasa';}
  else if(ratio>0.7){cl='warn';t='Ganancia mixta';}
  return {cl,t,s:`+${r1(dw)} kg de peso y ${dc>=0?'+':''}${r1(dc)} cm de cintura desde ${bs[0].slice(8)}/${bs[0].slice(5,7)}.`,dw,dc};
}
/* ---------------------------- recuperación ----------------------------- */
function rdScore(r){
  if(!r) return null;
  const sl=r.sleep>=8?25:r.sleep>=7?20:r.sleep>=6?12:5;
  const so=[0,25,20,14,7,2][r.sore]||10;
  const en=[0,3,9,16,21,25][r.ener]||12;
  const bo=[5,18,25][r.box]!==undefined?[5,18,25][r.box]:18;
  return Math.round(sl+so+en+bo);
}
function rdToday(){ return DB.rd[TODAY()]||null; }
function rdVerdict(s){
  if(s==null) return null;
  if(s>=75) return {cl:'',t:'Recuperado',s:'Entrena la sesión completa como está en la tabla.'};
  if(s>=55) return {cl:'mid',t:'Recuperación media',s:'Quita una serie al ejercicio principal y no te acerques al fallo.'};
  return {cl:'low',t:'Sin recuperar',s:'Hoy toca descarga: mitad de series, 60 % de la carga. O solo boxeo.'};
}
function rdAvg(n){
  const ks=Object.keys(DB.rd).sort().slice(-n);
  if(!ks.length) return null;
  return Math.round(ks.reduce((a,k)=>a+(DB.rd[k].score||0),0)/ks.length);
}
/* --------------------------- adherencia / racha ------------------------- */
function plannedDays(){ return plan().gym.filter(d=>d.e.length).length; }
function doneWeek(d){
  const ws=weekStart(d||TODAY()); let g=0,b=0,a=0;
  for(let i=0;i<7;i++){
    const dd=shift(ws,i), L=DB.log[dd]; if(!L) continue;
    if(L.gym||hasSets(dd,'gym')) g++;
    if(L.abs||hasSets(dd,'abs')) a++;
    if(L.box&&L.box.min) b++;
  }
  return {g,b,a};
}
function hasSets(d,m){
  const L=DB.log[d]; if(!L||!L.ex) return false;
  return Object.keys(L.ex).some(k=>k.startsWith(m+'|')&&(L.ex[k]||[]).some(s=>s&&(nm(s.kg)||nm(s.reps))));
}
function streak(){
  let n=0, d=TODAY();
  for(;;){ const L=DB.log[d];
    const act=L&&((L.box&&L.box.min)||L.gym||L.abs||hasSets(d,'gym')||hasSets(d,'abs'));
    if(act){n++; d=shift(d,-1);} else break;
    if(n>400) break;
  }
  return n;
}
function toast(m){

}

/* ============================== gráficas =============================== */
function lineChart(pts,opt){
  opt=opt||{};
  const W=320,H=opt.h||150,PL=34,PR=8,PT=12,PB=18;
  if(!pts.length) return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">Sin datos todavía</text></svg>`;
  const xs=pts.map((p,i)=>i), ys=pts.map(p=>p.v);
  let mn=Math.min(...ys), mx=Math.max(...ys);
  if(opt.series2&&opt.series2.length){mn=Math.min(mn,...opt.series2);mx=Math.max(mx,...opt.series2);}
  if(mn===mx){mn-=1;mx+=1;}
  const pad=(mx-mn)*.12; mn-=pad; mx+=pad;
  if(opt.min!=null&&mn<opt.min) mn=opt.min;
  const X=i=>PL+(pts.length===1?0:(i/(pts.length-1))*(W-PL-PR));
  const Y=v=>PT+(1-(v-mn)/(mx-mn))*(H-PT-PB);
  const col=opt.color||'#60a5fa';
  let g='';
  for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3, y=Y(v);
    g+=`<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`
      +`<text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`;}
  const d=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  const area=`${d} L${X(pts.length-1).toFixed(1)},${H-PB} L${X(0).toFixed(1)},${H-PB} Z`;
  let ln2='';
  if(opt.series2&&opt.series2.length===pts.length){
    ln2=`<path class="ln" d="${opt.series2.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(p).toFixed(1)}`).join(' ')}" stroke="${opt.color2||'#fb923c'}" stroke-dasharray="5 4" stroke-width="2"/>`;
  }
  let dots=pts.map((p,i)=>(pts.length<=26||i===pts.length-1)
    ?`<circle class="pt" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===pts.length-1?3.6:2.4}" fill="${col}"/>`:'').join('');
  const lab=(i)=>{const p=pts[i]; return p.l||(p.d?p.d.slice(8)+'/'+p.d.slice(5,7):'');};
  let xl=`<text x="${PL}" y="${H-5}">${lab(0)}</text>`;
  if(pts.length>1) xl+=`<text x="${W-PR}" y="${H-5}" text-anchor="end">${lab(pts.length-1)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}<path class="ar" d="${area}" fill="${col}"/>`+
    `<path class="ln" d="${d}" stroke="${col}"/>${ln2}${dots}${xl}</svg>`;
}
function barsChart(items,opt){
  opt=opt||{};
  const W=320,H=opt.h||150,PL=34,PR=8,PT=12,PB=20;
  if(!items.length) return `<svg class="chart" viewBox="0 0 ${W} ${H}"><text x="${W/2}" y="${H/2}" text-anchor="middle">Sin datos todavía</text></svg>`;
  const mx=Math.max(...items.map(i=>i.v),1)*1.15;
  const bw=(W-PL-PR)/items.length;
  let g='';
  for(let i=0;i<=3;i++){const v=mx*i/3, y=PT+(1-i/3)*(H-PT-PB);
    g+=`<line class="gl" x1="${PL}" y1="${y.toFixed(1)}" x2="${W-PR}" y2="${y.toFixed(1)}"/>`
      +`<text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end">${opt.fmt?opt.fmt(v):Math.round(v)}</text>`;}
  const bars=items.map((it,i)=>{
    const h=(it.v/mx)*(H-PT-PB), x=PL+i*bw+bw*.16, w=bw*.68, y=H-PB-h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(h,1).toFixed(1)}" rx="2.5" fill="${it.c||opt.color||'#a78bfa'}"/>`
      +`<text x="${(x+w/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${it.l||''}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}${bars}</svg>`;
}

let GS={on:false,ei:0,si:0,adj:1,rest:0,restEnd:0,ask:false,plates:false,end:false};

function gsSets(k){ return ((DB.log[TODAY()]||{}).ex||{})[k]||[]; }
function gsDoneSet(ex,k,i){ const s=gsSets(k)[i]; return !!(s&&nm(s.kg)!=null&&nm(s.reps)); }
/* primera serie sin registrar de todo el día */
function gsFirstPending(){
  const D=dayObj(mode,day);
  for(let e=0;e<D.e.length;e++){
    const k=exK(mode,day,D.e[e].n);
    for(let s=0;s<D.e[e].s;s++) if(!gsDoneSet(D.e[e],k,s)) return {ei:e,si:s};

function gsTick(){
  const el=$('#gsRest'); if(!el) return;
  const left=Math.max(0,Math.ceil((GS.restEnd-Date.now())/1000));
  el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left<=0){
    clearInterval(gsInt); gsInt=null; el.classList.add('done');
    beep(); if(navigator.vibrate) navigator.vibrate([200,100,200]);
    setTimeout(()=>{ if(GS.on&&GS.restEnd&&GS.restEnd<=Date.now()){ GS.restEnd=0; gsRender(); } },1200);
  }
}
function gsStartRest(sec){
  if(!sec){ GS.restEnd=0; return; }
  unlockAudio();
  GS.restEnd=Date.now()+sec*1000;
  clearInterval(gsInt); gsInt=setInterval(gsTick,250);
}
function gsSave(){
  const ex=gsEx(); if(!ex) return false;
  const kg=nm(($('#gsKg')||{}).value), rp=nm(($('#gsRp')||{}).value);
  if(kg==null&&rp==null){ toast('Pon al menos las repeticiones'); return false; }
  const k=exK(mode,day,ex.n), L=dlog(TODAY());
  L.ex[k]=L.ex[k]||[]; L.ex[k][GS.si]={};
  if(kg!=null) L.ex[k][GS.si].kg=String(kg);
  if(rp!=null) L.ex[k][GS.si].reps=String(rp);
  if(!L.start) L.start=Date.now();
  L.gym=(mode==='gym')||L.gym; L.abs=(mode==='abs')||L.abs;
  const isPR=prCheck(k,ex.n);
  saveNow();
  if(isPR){ toast('★ Récord en '+ex.n); if(navigator.vibrate) navigator.vibrate([30,60,30]); }
  return true;
}
function gsAdvance(){
  const D=dayObj(mode,day), ex=D.e[GS.ei];
  if(GS.si+1<ex.s){ GS.si++; gsStartRest(ex.rest); }
  else{
    GS.si=0; GS.adj=1; GS.ei++;
    if(GS.ei>=D.e.length){ GS.end=true; GS.restEnd=0; clearInterval(gsInt); gsInt=null; }
    else gsStartRest(ex.rest);
  }
  gsRender();
}

/* ======================= calculadora de discos ========================== */
const PLATES=[25,20,15,10,5,2.5,1.25];
function plates(total,bar){
  bar=bar||20;
  const per=(total-bar)/2;
  if(!(per>0)) return null;
  let r=per; const out=[];
  PLATES.forEach(s=>{ while(r>=s-0.004){ out.push(s); r=Math.round((r-s)*1000)/1000; } });
  return {per:Math.round(per*100)/100,out,rest:Math.round(r*100)/100};
}
function platesTxt(total,bar){
  const p=plates(total,bar);
  if(!p) return 'Menos que la barra ('+(bar||20)+' kg)';
  const g={}; p.out.forEach(s=>g[s]=(g[s]||0)+1);
  const txt=Object.keys(g).map(Number).sort((a,b)=>b-a)
    .map(s=>(g[s]>1?g[s]+'×':'')+s).join(' + ');
  return (txt||'nada')+' por lado'+(p.rest>0.01?' (sobran '+p.rest+' kg)':'');
}

/* ===================== autorregulación por RIR ========================== */
/* RIR = repeticiones en reserva. Si en la primera serie sobran muchas, la carga
   se queda corta y se corrige en el momento en vez de esperar a la próxima semana. */
const RIRADJ={0:-0.05,1:0,2:0,3:0.025,4:0.05,5:0.075};
/* Incremento mínimo real: en barra hacen falta dos discos iguales, así que el
   salto más pequeño con discos de 1,25 son 2,5 kg. No tiene sentido sugerir
   41 kg si no se pueden montar. */
function stepFor(kg){ return kg>=20?2.5:1; }
function roundLoad(kg){ const st=stepFor(kg); return Math.round(kg/st)*st; }
/* siguiente carga montable: al menos un incremento por encima */
function nextLoad(base,pct){
  const st=stepFor(base);
  return Math.max(base+st, Math.ceil((base*(1+pct))/st)*st);
}
function rirOf(k,date){
  const L=DB.log[date||TODAY()]; if(!L||!L.rir) return null;
  return L.rir[k]==null?null:+L.rir[k];
}
function setRir(k,v){
  const L=dlog(TODAY()); L.rir=L.rir||{};
  if(v==null) delete L.rir[k]; else L.rir[k]=v;
}

/* ==================== importar / exportar rutinas ====================== */
function normEx(x){
  x=x||{};
  const o={ n:String(x.n||'Ejercicio').trim().slice(0,90),
    s:Math.min(12,Math.max(1,parseInt(x.s)||3)),
    r:String(x.r==null?'8-12':x.r).trim().slice(0,26),
    i:(x.i&&IC[x.i])?x.i:'generic',
    t:String(x.t||'').trim().slice(0,12),
    rest:Math.min(600,Math.max(0,parseInt(x.rest)||90)),
    o:String(x.o||'').trim().slice(0,180), m:{} };
  const m=(x.m&&typeof x.m==='object')?x.m:{};
  Object.keys(m).forEach(k=>{ if(MUS.includes(k)){ const v=parseFloat(m[k]); if(v>0) o.m[k]=Math.min(2,v); } });
  return o;
}
function normSide(arr,base){
  const out=DK.map((k,i)=>({k,d:DLN[i].toUpperCase(),f:'Descanso',c:DCOL[i],n:'Descanso total.',e:[]}));
  if(base) base.forEach((d,i)=>{ if(out[i]) out[i]=JSON.parse(JSON.stringify(d)); });
  (arr||[]).forEach(d=>{
    const i=DK.indexOf(d&&d.k); if(i<0) return;
    out[i]={ k:DK[i], d:DLN[i].toUpperCase(), c:d.c||DCOL[i],
      f:String(d.f||'').trim().slice(0,40), n:String(d.n||'').trim().slice(0,160),
      e:(Array.isArray(d.e)?d.e:[]).map(normEx) };
  });
  return out;
}
/* Acepta {name, gym:[...], abs:[...]} o un bloque completo {name, plan:{gym,abs}}.
   Los días que no vengan quedan como descanso; si falta 'abs' entero, se mantiene el de base. */
function importRoutine(txt){
  const o=JSON.parse(txt);
  if(!o||typeof o!=='object') throw new Error('no es un objeto');
  const src=o.plan&&(o.plan.gym||o.plan.abs)?o.plan:o;
  const gymGiven=Array.isArray(src.gym), absGiven=Array.isArray(src.abs);
  if(!gymGiven&&!absGiven) throw new Error('no encuentro "gym" ni "abs"');
  /* se valida sobre lo que trae la rutina, no sobre lo heredado del plan base */
  const cnt=a=>(a||[]).reduce((s,d)=>s+(Array.isArray(d&&d.e)?d.e.length:0),0);
  const nEx=(gymGiven?cnt(src.gym):0)+(absGiven?cnt(src.abs):0);
  if(!nEx) throw new Error('la rutina no tiene ningún ejercicio');
  const base=planBase();
  const b={ id:Date.now(), name:String(o.name||'Rutina importada').trim().slice(0,44), start:TODAY(),
    plan:{ gym:normSide(src.gym, gymGiven?null:base.gym),
           abs:normSide(src.abs, absGiven?null:base.abs) } };
  return {block:b,nEx,nDias:b.plan.gym.filter(d=>d.e.length).length,
    heredaAbs:!absGiven,heredaGym:!gymGiven};
}
function exportRoutine(i){
  const b=DB.blocks[i];
  const strip=s=>b.plan[s].filter(d=>d.e.length).map(d=>({k:d.k,f:d.f,n:d.n,
    e:d.e.map(x=>({n:x.n,s:x.s,r:x.r,i:x.i,t:x.t,rest:x.rest,o:x.o,m:x.m}))}));
  return JSON.stringify({name:b.name,gym:strip('gym'),abs:strip('abs')},null,1);
}

    });
  });
  const b=[['Fecha','Peso','Cintura','Pecho','Brazo','Muslo','Hombros','Cuello','Cadera']];
  Object.keys(DB.body).sort().forEach(d=>{const o=DB.body[d];
    b.push([d,o.w??'',o.cintura??'',o.pecho??'',o.brazo??'',o.muslo??'',o.hombros??'',o.cuello??'',o.cadera??'']);});
  const q=r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';');
  const csv=['SERIES'].concat(rows.map(q)).concat(['','MEDIDAS']).concat(b.map(q)).join('\r\n');
  if(rows.length===1&&b.length===1){toast('Todavía no hay nada registrado.');return;}
  dl('registro_entreno_'+TODAY()+'.csv',csv,'text/csv;charset=utf-8');
}

$('#gs').addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.id==='gsX'||t.id==='gsFin'){
    if(t.id==='gsFin'){ const L=dlog(TODAY()); L.end=Date.now(); }
    gsClose(); return;
  }
  if(t.id==='gsGo'){ if(gsSave()){ if(GS.si===0){ GS.ask=true; gsRender(); } else gsAdvance(); } return; }
  if(t.dataset.rir!=null){
    const ex=gsEx(), k=ex?exK(mode,day,ex.n):null;
    if(t.dataset.rir!=='skip'&&k){
      const v=+t.dataset.rir;
      setRir(k,v);
      GS.adj=1+(RIRADJ[v]||0);
      saveNow();
      if(GS.adj!==1) toast(GS.adj>1?'Subo la carga un '+Math.round((GS.adj-1)*100)+' % en lo que queda'
                                   :'Bajo la carga un 5 % en lo que queda');
    }
    GS.ask=false; gsAdvance(); return;
  }
  if(t.id==='gsSkip'){ GS.restEnd=0; clearInterval(gsInt); gsInt=null; gsRender(); return; }
  if(t.id==='gsPl'){ GS.plates=!GS.plates; gsRender(); return; }
  if(t.id==='gsPrev'){
    GS.end=false; GS.restEnd=0; GS.ask=false;
    if(GS.si>0) GS.si--;
    else if(GS.ei>0){ GS.ei--; GS.si=Math.max(0,(dayObj(mode,day).e[GS.ei].s||1)-1); GS.adj=1; }
    gsRender(); return;
  }
  if(t.id==='gsNext'){
    const D=dayObj(mode,day), ex=D.e[GS.ei]; if(!ex) return;
    GS.restEnd=0; GS.ask=false;
    if(GS.si+1<ex.s) GS.si++;
    else if(GS.ei+1<D.e.length){ GS.ei++; GS.si=0; GS.adj=1; }
    else GS.end=true;
    gsRender(); return;
  }
  const st=t.dataset.step;
  if(st){
    const [f,d]=st.split(':');
    if(f==='kg'){ const i=$('#gsKg'); const v=nm(i.value)||0;
      const inc=v>=60?2.5:(v>=20?1.25:0.5);
      i.value=Math.max(0,Math.round((v+inc*(+d))*100)/100); }
    else{ const i=$('#gsRp'); i.value=Math.max(0,(nm(i.value)||0)+(+d)); }
    if(GS.plates) gsRender();
    return;
  }
});

/* --------- cronómetro --------- */
let tEnd=0,tInt=null,actx=null;
const tdisp=$('#tdisp');
function paint(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  tdisp.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
  if(left<=0){clearInterval(tInt);tInt=null;tdisp.className='tdisp done';beep();
    if(navigator.vibrate)navigator.vibrate([200,100,200]);}
}
/* iOS exige que el contexto de audio nazca (y se reanude) dentro de un toque */
function unlockAudio(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    if(!actx._warm){
      const o=actx.createOscillator(),g=actx.createGain();
      g.gain.value=0.0001; o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime+.02); actx._warm=1;
    }
  }catch(e){}
}
document.addEventListener('touchend',unlockAudio,{once:true,passive:true});
document.addEventListener('click',unlockAudio,{once:true});
function startTimer(sec){
  if(!sec) return;
  unlockAudio();
  tEnd=Date.now()+sec*1000; tdisp.className='tdisp run';
  clearInterval(tInt); paint(); tInt=setInterval(paint,250);
  if(navigator.vibrate)navigator.vibrate(30);
}
function beep(){
  try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    [0,.22,.44].forEach(t=>{ const o=actx.createOscillator(),g=actx.createGain();
      o.type='sine'; o.frequency.value=880;
      g.gain.setValueAtTime(.001,actx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.3,actx.currentTime+t+.02);
      g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+.16);
      o.connect(g); g.connect(actx.destination);
      o.start(actx.currentTime+t); o.stop(actx.currentTime+t+.18); });
  }catch(e){}
}
$$('.timerbar button[data-t]').forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
$('#tstop').onclick=()=>{clearInterval(tInt);tInt=null;tdisp.className='tdisp';tdisp.textContent='0:00';};

let swReg=null, swWaiting=null;
function showUpdateBar(){
  if($('#updBar')) return;
  const d=document.createElement('div');
  d.id='updBar';
  d.style.cssText='position:fixed;left:8px;right:8px;bottom:calc(120px + env(safe-area-inset-bottom,0px));'+

    'display:flex;gap:9px;align-items:center;max-width:604px;margin:0 auto;'+
    'box-shadow:0 8px 28px rgba(0,0,0,.55)';
  d.innerHTML='<div style="flex:1 1 0;min-width:0;font-size:13px;color:#ffd7b0">'+
    '<b>Hay una versión nueva.</b> Tus datos se conservan.</div>'+
    '<button type="button" id="updGo" class="btn pri" style="flex:0 0 auto;padding:9px 13px">Actualizar</button>'+
    '<button type="button" id="updNo" class="btn" style="flex:0 0 auto;padding:9px 11px">Luego</button>';
  document.body.appendChild(d);
  $('#updGo').onclick=()=>{
    saveNow(); bakNow();
    if(swWaiting){ swWaiting.postMessage('skipWaiting'); setTimeout(()=>location.reload(),900); }
    else location.reload();
  };
  $('#updNo').onclick=()=>d.remove();
}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    if(reg.waiting){ swWaiting=reg.waiting; showUpdateBar(); }
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing; if(!nw) return;
      nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){ swWaiting=nw; showUpdateBar(); }
      });
    });
  }).catch(()=>{});
  let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloaded) return; reloaded=true; location.reload();
  });
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden&&swReg) swReg.update().catch(()=>{}); });
}
